[package]
name = "cxx_qt_test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0.156"
cxx-qt = "0.7.1"
cxx-qt-lib = { version = "0.7.1", features = ["qt_full"] }

[build-dependencies]
# The link_qt_object_files features is required for statically linking Qt 6.
cxx-qt-build = { version = "0.7.1", features = ["link_qt_object_files"] }

[features]
# This feature must be enabled for `cargo test` when linking Qt 6 statically.
link_qt_object_files = [ "cxx-qt-build/link_qt_object_files" ]